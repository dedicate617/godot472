name: Build Matrix CI/CD

'on':
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Target Godot Upstream Version / Tag'
        required: false
        default: '4.7.2-stable'
        type: string
      godot_repo_url:
        description: 'Target Godot Repository URL'
        required: false
        default: 'https://github.com/godotengine/godot.git'
        type: string
      dry_run:
        description: 'Dry run simulation mode (skip actual compilation)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x86_64
            package-platform: windows
            artifact-name: mindscada-windows-x64
            targets: "editor template_debug template_release"

          - name: linux-arm32
            os: ubuntu-latest
            platform: linux
            arch: arm32
            package-platform: pi32
            artifact-name: mindscada-linux-arm32
            targets: "template_debug template_release"
            apt-packages: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config"

          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64
            package-platform: pi64
            artifact-name: mindscada-linux-arm64
            targets: "template_debug template_release"
            apt-packages: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config"

          - name: web-wasm32
            os: ubuntu-latest
            platform: web
            arch: wasm32
            package-platform: web
            artifact-name: mindscada-web-wasm32
            targets: "template_debug template_release"
            emscripten: true
            emscripten-version: "4.0.11"

    steps:
      - name: Checkout mindscada-engine-ext
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons & Build Tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install ARM Cross-Compilation Toolchains
        if: runner.os == 'Linux' && matrix.apt-packages != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-packages }}

      - name: Set up Emscripten SDK
        if: matrix.emscripten == true
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ matrix.emscripten-version || '4.0.11' }}
          no-cache: true

      - name: Verify Emscripten Toolchain
        if: matrix.emscripten == true
        shell: bash
        run: |
          emcc -v
          node -v

      - name: Resolve Godot Version and Release Tag
        id: versions
        shell: bash
        run: |
          # Derive plain version (e.g. 4.7.2) from the godot_version input
          GODOT_VER="${{ inputs.godot_version || '4.7.2-stable' }}"
          PLAIN_VER="${GODOT_VER%%-*}"    # strip -stable / -rc suffix
          PLAIN_VER="${PLAIN_VER#v}"      # strip leading v

          # If triggered by a git tag (refs/tags/v*), derive plain version from tag
          # Tag format: v4.7.2-20260910 → 4.7.2
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            PLAIN_VER=$(echo "$RELEASE_TAG" | sed 's/^v//' | cut -d'-' -f1)
          else
            # For branch pushes / PRs / manual dispatch: generate a date-based tag
            BUILD_DATE=$(date -u +%Y%m%d)
            RELEASE_TAG="v${PLAIN_VER}-${BUILD_DATE}"
          fi

          echo "godot_ver=${GODOT_VER}"    >> $GITHUB_OUTPUT
          echo "plain_ver=${PLAIN_VER}"    >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          echo "Godot version : ${GODOT_VER}"
          echo "Plain version : ${PLAIN_VER}"
          echo "Release tag   : ${RELEASE_TAG}"

      - name: Sync Godot Upstream and Apply Patches
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python scripts/sync_upstream.py \
            --version "${{ steps.versions.outputs.godot_ver }}" \
            --repo-url "${{ inputs.godot_repo_url || 'https://github.com/godotengine/godot.git' }}" \
            $EXTRA_ARGS

      - name: Configure SCons Cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/scons
            ${{ github.workspace }}/.cache/scons
            ${{ github.workspace }}/../godot.4.7.2/.sconsign*
          key: ${{ matrix.name }}-scons-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.name }}-scons-${{ github.ref }}-
            ${{ matrix.name }}-scons-

      - name: Build Engine Targets via Build Driver
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          for target in ${{ matrix.targets }}; do
            echo "::group::Building target: $target (${{ matrix.platform }}-${{ matrix.arch }})"
            python scripts/build.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --target "$target" $EXTRA_ARGS
            echo "::endgroup::"
          done

      - name: Package Distribution Artifacts
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python scripts/package.py \
            --platform ${{ matrix.package-platform }} \
            --version "${{ steps.versions.outputs.plain_ver }}" \
            $EXTRA_ARGS

      - name: Upload Build Artifacts (CI cache)
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # -----------------------------------------------------------------------
      # GitHub Release: upload assets when triggered by a tag push (v*)
      # or a workflow_dispatch from a tag ref.
      # Each platform job independently uploads its own packaged assets.
      # gh release create is idempotent — concurrent jobs safely race to create.
      # -----------------------------------------------------------------------
      - name: Create or Update GitHub Release and Upload Assets
        if: >
          inputs.dry_run != true &&
          startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.versions.outputs.release_tag }}
          PLAIN_VER: ${{ steps.versions.outputs.plain_ver }}
        run: |
          gh --version

          RELEASE_NOTES="## MindSCADA Engine v${PLAIN_VER}

          **Built from Godot ${PLAIN_VER} with MindSCADA custom modules and patches.**

          ### Included Assets
          | File | Description |
          |------|-------------|
          | \`MindStudio_v*_Windows_x86_64.zip\` | Windows x64 Editor + WebView2 runtime |
          | \`MindSCADA_v*_export_templates_windows.tpz\` | Windows x64 Export Templates |
          | \`MindSCADA_v*_export_templates_pi32.tpz\` | Linux ARM32 (Raspberry Pi 32-bit) Export Templates |
          | \`MindSCADA_v*_export_templates_pi64.tpz\` | Linux ARM64 (Raspberry Pi 64-bit) Export Templates |
          | \`MindSCADA_v*_export_templates_web.tpz\` | Web (WASM32 Threads) Export Templates (Debug & Release) |
          | \`MindSCADA_v*_Web_bundle.zip\` | Web (WASM32) Standalone Deployment Bundle |
          | \`checksums.sha256\` | SHA256 checksums manifest |

          ### Installing Export Templates
          In Godot Editor: **Project → Export → Manage Export Templates → Install from file (.tpz)**"

          # Create release if it doesn't exist yet (idempotent, safe for parallel jobs)
          if ! gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Creating release: ${RELEASE_TAG}"
            gh release create "${RELEASE_TAG}" \
              --repo "${{ github.repository }}" \
              --title "MindSCADA Engine v${PLAIN_VER}" \
              --notes "${RELEASE_NOTES}" \
              --draft=false \
              --prerelease=false
          else
            echo "Release ${RELEASE_TAG} already exists — uploading assets only."
          fi

          # Upload all dist/ archives and checksums for this platform
          echo "Uploading dist/ assets for platform: ${{ matrix.name }}"
          for asset in dist/*.zip dist/*.tpz dist/checksums.sha256; do
            if [ -f "$asset" ]; then
              echo "  → ${asset}"
              gh release upload "${RELEASE_TAG}" "$asset" \
                --repo "${{ github.repository }}" \
                --clobber
            fi
          done
          echo "Upload complete for ${{ matrix.name }}."
