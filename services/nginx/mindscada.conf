# ==============================================================================
# MindSCADA Nginx Reverse Proxy & SSL Gateway Configuration (Linux / CM4 AArch64)
# Deploy location: /etc/nginx/sites-available/mindscada.conf
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Redirect HTTP (Port 80) to HTTPS (Port 443)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 2. Unified HTTPS & Secure WebSocket (WSS) Gateway (Port 443 & 8443)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/mindscada/mindscada.crt;
    ssl_certificate_key /etc/ssl/mindscada/mindscada.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cross-Origin Isolation Headers (Required for Godot 4 SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;

    root /home/pi/aarch64/web;
    index index.html mindscada.html;

    # 2.1 Real-time WebSocket Gateway (Terminating WSS and forwarding to local 8088)
    location /scada_ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2.2 RPC /invoke (Forwarding to local 8088)
    location /invoke {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 2.3 Report Direct Export /export (Forwarding to local 8088)
    location /export {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 2.4 Remote Stream Gateway (Port 8095)
    location /stream/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 2.5 Static Web SCADA Files
    location / {
        try_files $uri $uri/ =404;
    }
}
